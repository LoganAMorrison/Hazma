# An explicit empty workspace, not an oversight: without it cargo walks
# up the filesystem looking for a workspace root and can be captured by
# an unrelated Cargo.toml above the checkout (a stray one in a developer's
# home directory is enough to make `cargo build` fail here).
[workspace]

[package]
name = "hazma-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compiled numerical kernels for the hazma Python package."
repository = "https://github.com/LoganAMorrison/Hazma"
publish = false

[lib]
# The cdylib's name fixes the module-init symbol PyO3 generates
# (`PyInit__core`), which must match the last component of the Python
# import path `hazma._core` that maturin installs it under
# (`[tool.maturin] module-name` in pyproject.toml). Renaming this without
# renaming the `#[pymodule]` in src/lib.rs yields a shared object Python
# cannot import.
name = "_core"
# `rlib` alongside `cdylib` so `cargo test` has a library to link the
# test harness against; the wheel only ever ships the cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310 builds against CPython's limited API, so one shared object
# serves every CPython >= 3.10 (pyproject.toml's `requires-python`). This
# feature is also where the wheel's tag comes from: maturin reads it and
# tags the wheel `cp310-abi3`, so raising the floor here raises the floor
# of every published wheel.
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
numpy = "0.29.0"
# The special functions the Cython layer cimports from
# `scipy.special.cython_special` (spence, k1, kn). `spec_math` is a Rust
# re-implementation of Moshier's cephes — the same lineage scipy's own
# `spence`/`k1` wrap — and is MIT OR Apache-2.0, so it satisfies
# ADR-0002's "nothing GSL-derived" rule. See src/special.rs for the
# per-function provenance and the measured agreement with scipy.
spec_math = "0.1.6"

[features]
default = ["extension-module"]
# `extension-module` tells PyO3 to leave CPython's symbols undefined, to
# be resolved by the interpreter that dlopens us. That is right for the
# shared object and wrong for a test executable, which has no interpreter
# to resolve them — so it is a feature rather than a hard dependency, and
# the unit tests run as `cargo test --no-default-features`, which links
# libpython instead. Phase 02 Task 2.2 wires that spelling into
# scripts/agents/preflight.sh and the dev-loop docs.
extension-module = ["pyo3/extension-module"]
# The six `*_probe` modules in src/, which register `hazma._core`
# submodules that exist only so `test/test_core_*.py` can reach the
# foundation layers from Python. Off by default so neither the wheel nor
# the sdist carries them: an sdist builds through the same PEP 517 hook
# on every platform without a published wheel, so a default-on feature
# would ship the probes everywhere maturin is not the one building.
#
# Turned on for a development install and for the crate's own gates:
#
#     pip install -e . --config-settings build-args="--features test-probes"
#     cargo clippy --manifest-path rust/Cargo.toml --all-features --all-targets
#     cargo test --manifest-path rust/Cargo.toml --no-default-features \
#         --features test-probes
#
# `build-args` rather than `maturin.build-args`: maturin reads the
# namespaced spelling from 1.9 on and means to drop the bare one in 2.0,
# but 1.5 — this project's floor in pyproject.toml — reads only the bare
# one, and a config setting it does not recognize is ignored rather than
# refused. So the bare spelling is the only one that works across the
# whole `maturin>=1.5,<2.0` range; raise the floor past 1.9 and the
# namespaced one becomes the one to write.
test-probes = []

[profile.release]
# The kernels this crate will hold are scalar float64 math; LTO and a
# single codegen unit cost build time once and buy inlining across the
# module boundary.
lto = true
codegen-units = 1
