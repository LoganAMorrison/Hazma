# Lint, build, and test hazma on every push to master and every pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install linters
        # The pins live in pyproject.toml's [dependency-groups] `lint`
        # group, never here. A literal pin in this file is what drifted
        # from the pyproject one and made Lint reject a locally-clean
        # tree. `--group` needs pip >= 25.1 and installs only the group,
        # so this job still does not build the Cython extensions.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint
      - name: Check formatting with black
        run: black --check --diff hazma test
      - name: Lint with ruff (critical errors only)
        # Same gate the old flake8 step enforced: syntax errors, undefined
        # names, and broken comparisons/f-strings. --isolated keeps this
        # independent of the (stricter) ruff config in pyproject.toml.
        run: >-
          ruff check --isolated
          --select E9,F63,F7,F82
          --exclude hazma/experimental
          --exclude notebooks
          .

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        # Not for the build: `cargo test` links libpython for real. The
        # crate's `extension-module` feature is what lets a *wheel* leave
        # CPython's symbols undefined, and the test harness has no
        # interpreter to resolve them — hence --no-default-features
        # below, and hence a Python on PATH here.
        with:
          python-version: "3.12"
      - name: Check formatting with rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Lint with clippy
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --all-targets -- -D warnings
      - name: Run the crate's unit tests
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        # pyproject.toml's [build-system] requires setuptools-rust, which
        # shells out to cargo — so from cython-to-rust Phase 02 on, no
        # cargo means no build at all, on either OS. The GitHub-hosted
        # images happened to ship one already (measured on PR #55: the
        # whole matrix went green with no toolchain step), but nothing in
        # this repo required them to keep doing so, and an image refresh
        # that dropped Rust would have taken every entry down at once.
      - name: Build and install hazma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .
          python -m pip install pytest pytest-xdist
      - name: Import smoke test
        # The test suite only touches part of the public API; importing the
        # main entry points catches missing dependencies, missing package
        # data, and build/runtime scipy ABI mismatches. Run outside the repo
        # so the installed package is imported, not the source tree.
        #
        # This step is the only thing in CI that exercises the *installed*
        # distribution, which is why it runs before the editable reinstall
        # below rather than after it. A missing entry in
        # [tool.setuptools.package-data] is invisible from the source tree.
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import hazma.theory, hazma.limits, hazma.cmb, hazma.pbh,
          hazma.scalar_mediator, hazma.vector_mediator,
          hazma.spectra._photon._muon"
      - name: Reinstall editable for the test run
        # The golden parity corpus (test/parity/, cython-to-rust Phase 01)
        # refuses to measure a hazma that resolves outside the repository —
        # cases.assert_module_is_repo_tree. Running pytest from the repo root
        # puts the source tree first on sys.path either way, so without an
        # editable install the compiled extensions simply would not be
        # there. Editable puts them in the tree the corpus is pinned to.
        # Measured cost of the second build: ~40 s.
        run: python -m pip install -v -e .
      - name: Run tests
        # Bare `pytest` on every matrix entry: pyproject.toml's
        # `testpaths = ["hazma", "test"]`, the same collection
        # scripts/agents/preflight.sh runs, parity corpus included.
        #
        # From PR #52 until the parity-corpus stability fix (2026-08-18)
        # this step carried a `PARITY` env that passed
        # `--ignore=test/parity` off macOS, because the corpus did not
        # survive a change of libm: ~70-75 of the 626 blocks failed on
        # Linux/glibc, six of them at catastrophic-cancellation points
        # where the pinned value flipped sign. `test/parity/stability.py`
        # now masks the points that cancel, `tolerances.PLATFORM_EXACT_RTOL`
        # covers the last-bit libm differences the EXACT class used to
        # reject, and `tolerances.zero_floor` covers the quadrature
        # endpoints that return 2.6e-13 where macOS returns exactly 0.0.
        # Verified green on Linux/x86_64 and Linux/aarch64 before this
        # scoping came out; see
        # docs/followups/done/parity-corpus-pins-ill-conditioned-points.md.
        #
        # The corpus costs ~5 minutes of single-core quadrature, spread
        # across the runner's cores by the pytest-xdist `addopts` in
        # pyproject.toml — hence the pytest-xdist install above.
        run: python -m pytest
